name: Build Shanaya

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the completed platform packages as a GitHub Release
        type: boolean
        required: true
        default: false
      release_tag:
        description: New version tag to create when publishing manually (for example v1.0.0)
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_OFFLINE_MODEL_URL: ${{ vars.VITE_OFFLINE_MODEL_URL }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

jobs:
  web:
    name: Web and PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - uses: actions/upload-artifact@v4
        with:
          name: shanaya-web-pwa
          path: client/dist

  electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap add @capawesome/capacitor-electron
        working-directory: client
      - run: npm install
        working-directory: client/electron
      - run: npx cap sync @capawesome/capacitor-electron
        working-directory: client
      - name: Package Electron app
        working-directory: client/electron
        shell: bash
        env:
          CSC_LINK_VALUE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_LINK || runner.os == 'macOS' && secrets.MACOS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD_VALUE: ${{ runner.os == 'Windows' && secrets.WINDOWS_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK_VALUE" ] && [ ! -d "$CSC_LINK_VALUE" ]; then
            export CSC_LINK="$CSC_LINK_VALUE"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_VALUE"
          else
            if [ -n "$CSC_LINK_VALUE" ]; then
              echo "Ignoring CSC_LINK because it points to a directory, not a certificate file or encoded certificate."
            fi
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # GitHub Releases are published by the dedicated release job below.
          # Do not let electron-builder attempt an automatic Snap Store upload;
          # snapcraft is not installed on the runner and Snap is not required
          # for the release assets staged by this workflow.
          npm run pack -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: shanaya-electron-${{ matrix.os }}
          path: client/electron/dist/**
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.22.1"
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap sync android
        working-directory: client
      - run: npm run cap:patch:android
        working-directory: client
      - name: Build Android package
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shanaya-release.keystore"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/shanaya-release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shanaya-android
          path: client/android/app/build/outputs/apk/**/*.apk

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run cap:patch:ios
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap sync ios
        working-directory: client
      - name: Import Apple signing certificate
        if: vars.IOS_SIGNING_ENABLED == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - name: Install provisioning profile
        if: vars.IOS_SIGNING_ENABLED == 'true'
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          profile-type: IOS_APP_STORE
          bundle-id: com.shanaya.companion
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Archive iOS app
        env:
          IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$IOS_SIGNING_ENABLED" = "true" ]; then
            SIGNING_ALLOWED=YES
          else
            SIGNING_ALLOWED=NO
          fi
          if [ -d client/ios/App/App.xcworkspace ]; then
            XCODE_CONTAINER=(-workspace client/ios/App/App.xcworkspace)
          elif [ -d client/ios/App/App.xcodeproj ]; then
            XCODE_CONTAINER=(-project client/ios/App/App.xcodeproj)
          else
            echo "No generated iOS workspace or project found under client/ios/App" >&2
            find client/ios -maxdepth 3 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print >&2 || true
            exit 1
          fi
          xcodebuild \
            "${XCODE_CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shanaya.xcarchive" \
            CODE_SIGNING_ALLOWED="$SIGNING_ALLOWED" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
      - name: Export signed iOS IPA
        if: vars.IOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Shanaya.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: shanaya-ios-archive
          path: |
            ${{ runner.temp }}/Shanaya.xcarchive
            ${{ runner.temp }}/ios-export/*.ipa

  release:
    name: Publish release installers
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [electron, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$RELEASE_TAG'; use vMAJOR.MINOR.PATCH (optionally with a prerelease suffix)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: shanaya-*
          path: release-input
          merge-multiple: false
      - name: Stage platform installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find_file() {
            local root="$1"
            local pattern="$2"
            local exclude="${3:-}"
            if [ -n "$exclude" ]; then
              find "$root" -type f -iname "$pattern" ! -path "$exclude" -print -quit
            else
              find "$root" -type f -iname "$pattern" -print -quit
            fi
          }

          copy_required() {
            local root="$1"
            local pattern="$2"
            local destination="$3"
            local exclude="${4:-}"
            local source
            source="$(find_file "$root" "$pattern" "$exclude")"
            if [ -z "$source" ]; then
              echo "Missing release package: $pattern under $root" >&2
              exit 1
            fi
            cp "$source" "release-assets/$destination"
          }

          copy_required release-input/shanaya-android '*.apk' 'Shanaya-Android.apk'
          copy_required release-input/shanaya-electron-macos-15 '*.dmg' 'Shanaya-macOS.dmg'
          copy_required release-input/shanaya-electron-windows-2022 '*.exe' 'Shanaya-Windows.exe' '*/win-unpacked/*'

          linux_appimage="$(find_file release-input/shanaya-electron-ubuntu-24.04 '*.AppImage')"
          linux_deb="$(find_file release-input/shanaya-electron-ubuntu-24.04 '*.deb')"
          if [ -z "$linux_appimage" ] && [ -z "$linux_deb" ]; then
            echo 'Missing Linux AppImage and DEB release packages' >&2
            exit 1
          fi
          if [ -n "$linux_appimage" ]; then
            cp "$linux_appimage" release-assets/Shanaya-Linux.AppImage
          fi
          if [ -n "$linux_deb" ]; then
            cp "$linux_deb" release-assets/Shanaya-Linux.deb
          fi

          ios_ipa="$(find_file release-input/shanaya-ios-archive '*.ipa')"
          if [ -n "$ios_ipa" ]; then
            cp "$ios_ipa" release-assets/Shanaya-iOS.ipa
          else
            cat > release-assets/iOS-Installation.txt <<'NOTICE'
          This build does not include an installable iOS package because Apple signing is not configured.
          Set the IOS_SIGNING_ENABLED repository variable and the Apple signing/App Store Connect secrets
          described in README.md, then publish a new version tag. iOS installation requires TestFlight
          or App Store distribution.
          NOTICE
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Shanaya $RELEASE_TAG"
          fi
